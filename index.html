<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./dist/style.css" rel="stylesheet">
    <title>Estacionamento</title>
</head>
<body>
    <div class="container py-6">

        <h1 class="text-center mb-10">Gestão de Estacionamento</h1>

        <h2 class="text-center text-zinc-600">Registrar Veículo</h2>

        <form id="envia-veiculo">
            <input type="text" name="nome" id="nome" placeholder="Nome do veículo ..." class="mb-3">
            <input type="text" name="placa" id="placa" placeholder="Placa do veículo ..." class="mb-3">
            <button id="cadastrar" class="btn mb-10">Cadastrar</button>
        </form>

        <h2 class="text-center text-zinc-600">Veículos Estacionados</h2>
        <table class="data-table">
            <thead>
                <th class="w-1/4">Nome</th>
                <th class="w-1/4">Placa</th>
                <th class="w-1/4">Entrada</th>
                <th class="w-1/4"></th>
            </thead>
            <tbody id="patio"></tbody>
        </table>
    </div>

    <script type="module" src="./dist/script.js"></script>
</body>
</html>
